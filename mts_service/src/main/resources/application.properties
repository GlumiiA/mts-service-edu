spring.application.name=mts_service

# Primary DataSource (mts_db) - XA
spring.datasource.xa.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mts_db}
spring.datasource.xa.user=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.xa.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# Billing DataSource (billing_db) - XA
billing.datasource.xa.url=${BILLING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/billing_db}
billing.datasource.xa.user=${BILLING_DATASOURCE_USERNAME:postgres}
billing.datasource.xa.password=${BILLING_DATASOURCE_PASSWORD:postgres}

spring.docker.compose.enabled=false

# Flyway managed manually via FlywayConfig
spring.flyway.enabled=false

# Narayana transaction object store
com.arjuna.ats.arjuna.objectstore.objectStoreDir=./ObjectStore

payments.base-url=https://payments.example.com/mock-pay

# Pagination
app.pagination.default-limit=20

# Currency
app.currency.code=RUB

# Mock authentication
app.auth.mock-header=X-Mock-User
app.auth.default-user=mock@local
app.auth.manager-user=manager@local
app.auth.admin-user=admin@local
app.auth.xml-file=users.xml

# User ID header
app.auth.user-id-header=X-User-Id

# Security public endpoints
app.security.public-post-endpoints=/api/users
app.security.public-endpoints=/error,/api/demo/**

# JAAS users XML file path (writable, on filesystem)
app.security.users-xml-path=./data/users.xml

# Elasticsearch
spring.elasticsearch.uris=${ELASTICSEARCH_URL:http://localhost:9200}
spring.elasticsearch.username=${ELASTICSEARCH_USERNAME:}
spring.elasticsearch.password=${ELASTICSEARCH_PASSWORD:}

# Enable indexing of tariffs on application start
app.search.index-on-start=false

# AMQP 1.0 / JMS (RabbitMQ)
app.messaging.broker-url=${APP_MESSAGING_BROKER_URL:amqp://localhost:5672}
app.messaging.username=${APP_MESSAGING_USERNAME:rabbitmq}
app.messaging.password=${APP_MESSAGING_PASSWORD:rabbitmq}
app.messaging.approval.queue-address=${APP_MESSAGING_APPROVAL_QUEUE_ADDRESS:/queues/application.approval.requested}
app.messaging.connection.queue-address=${APP_MESSAGING_CONNECTION_QUEUE_ADDRESS:/queues/application.connection.requested}
app.messaging.dead-letter.queue-address=${APP_MESSAGING_DEAD_LETTER_QUEUE_ADDRESS:/queues/application.workflow.dlq}
app.messaging.outbox.dispatch-fixed-delay-ms=${APP_MESSAGING_OUTBOX_DISPATCH_FIXED_DELAY_MS:1000}
app.messaging.outbox.batch-size=${APP_MESSAGING_OUTBOX_BATCH_SIZE:20}
app.messaging.outbox.max-attempts=${APP_MESSAGING_OUTBOX_MAX_ATTEMPTS:5}
app.messaging.outbox.retry-delay-ms=${APP_MESSAGING_OUTBOX_RETRY_DELAY_MS:2000}
app.messaging.listener.max-delivery-attempts=${APP_MESSAGING_LISTENER_MAX_DELIVERY_ATTEMPTS:5}
