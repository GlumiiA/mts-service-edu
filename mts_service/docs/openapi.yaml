openapi: 3.0.3
info:
  title: ИС Каталог и Личный кабинет пользователя
  description: |
    REST API для системы управления тарифами, заявками на подключение и личным кабинетом.

    ## Категории тарифов и их DTO
    Модель тарифа в БД единая (с полем `category`), но карточки отличаются набором полей:
    - **home** — скорость, ТВ-каналы, доп. услуги, цена по городу
    - **mobile** — ГБ интернета, минуты, SMS, флаги для_семьи / без_абон_платы
    - **devices** — ГБ интернета, тип устройства (часы / модем)
    - **landline** — минуты, цена по городу
    - **satellite_tv** — кол-во каналов, цена по городу
    - **business** — скорость, описание SLA, доп. услуги
  version: 1.1.0

tags:
  - name: catalog-home
    description: "Вкладка 1: Связь, ТВ и интернет"
  - name: catalog-mobile
    description: "Вкладка 2: Мобильная связь"
  - name: catalog-devices
    description: "Вкладка 3: Для часов и модемов"
  - name: catalog-landline
    description: "Вкладка 4: Домашний телефон"
  - name: catalog-satellite
    description: "Вкладка 5: Спутниковое ТВ"
  - name: catalog-business
    description: "Вкладка 6: Тарифы для бизнеса"
  - name: catalog-common
    description: Общие эндпоинты каталога
  - name: tariffs
    description: Управление тарифами (Администратор)
  - name: applications
    description: Заявки на подключение
  - name: account
    description: Личный кабинет пользователя
  - name: balance
    description: Баланс и платежи
  - name: users
    description: Управление пользователями (регистрация)
  - name: one-c-integration
    description: Интеграция с 1C (GET sync статус, управление отклонениями, ретраи, ошибки)

paths:

  /api/users:
    post:
      tags: [users]
      summary: Создать пользователя
      description: Создать новый аккаунт пользователя. Доступно без авторизации.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '409':
          description: Пользователь с таким email уже существует
        '400':
          description: Ошибка валидации

  /catalog/home:
    get:
      tags: [catalog-home]
      summary: Тарифы «Связь, ТВ и интернет»
      description: Цена и доступность зависят от города. Карточка содержит скорость, ТВ-каналы, доп. услуги.
      parameters:
        - name: city_id
          in: query
          required: true
          schema:
            type: string
          example: "city_msk"
        - name: price_max
          in: query
          schema:
            type: number
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Список тарифов
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TariffHomeCard'
                  next_cursor:
                    type: string
                    nullable: true
                    description: Передай в параметр after для загрузки следующей порции. null — больше данных нет.
                  has_more:
                    type: boolean
        '400':
          description: Не передан city_id

  /catalog/mobile:
    get:
      tags: [catalog-mobile]
      summary: Тарифы «Мобильная связь»
      description: Федеральные тарифы, цена не зависит от города. Карточка содержит ГБ, минуты, SMS, флаги.
      parameters:
        - name: internet_gb
          in: query
          schema:
            type: integer
          description: Минимальный объём интернета, ГБ
        - name: calls_minutes
          in: query
          schema:
            type: integer
          description: Минимальное кол-во минут
        - name: for_family
          in: query
          schema:
            type: boolean
          description: true — только семейные тарифы
        - name: no_subscription_fee
          in: query
          schema:
            type: boolean
          description: true — только без абонентской платы
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Список тарифов
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TariffMobileCard'
                  next_cursor:
                    type: string
                    nullable: true
                    description: Передай в параметр after для загрузки следующей порции. null — больше данных нет.
                  has_more:
                    type: boolean

  /catalog/devices:
    get:
      tags: [catalog-devices]
      summary: Тарифы «Для часов и модемов»
      description: Без фильтров. Карточка содержит объём интернета и тип устройства.
      parameters:
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Список тарифов
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TariffDeviceCard'
                  next_cursor:
                    type: string
                    nullable: true
                    description: Передай в параметр after для загрузки следующей порции. null — больше данных нет.
                  has_more:
                    type: boolean

  /catalog/landline:
    get:
      tags: [catalog-landline]
      summary: Тарифы «Домашний телефон»
      description: Цена зависит от города. Карточка содержит минуты на городские/межгород/мобильные.
      parameters:
        - name: city_id
          in: query
          required: true
          schema:
            type: string
          example: "city_spb"
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Список тарифов
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TariffLandlineCard'
                  next_cursor:
                    type: string
                    nullable: true
                    description: Передай в параметр after для загрузки следующей порции. null — больше данных нет.
                  has_more:
                    type: boolean
        '400':
          description: Не передан city_id

  /catalog/satellite-tv:
    get:
      tags: [catalog-satellite]
      summary: Тарифы «Спутниковое ТВ»
      description: Цена зависит от города. Карточка содержит кол-во каналов и HD-каналов.
      parameters:
        - name: city_id
          in: query
          required: true
          schema:
            type: string
          example: "city_nsk"
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Список тарифов
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TariffSatelliteCard'
                  next_cursor:
                    type: string
                    nullable: true
                    description: Передай в параметр after для загрузки следующей порции. null — больше данных нет.
                  has_more:
                    type: boolean
        '400':
          description: Не передан city_id

  /catalog/business:
    get:
      tags: [catalog-business]
      summary: Тарифы «Для бизнеса»
      description: Без фильтров. Карточка содержит скорость, SLA, доп. услуги.
      parameters:
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Список тарифов
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TariffBusinessCard'
                  next_cursor:
                    type: string
                    nullable: true
                    description: Передай в параметр after для загрузки следующей порции. null — больше данных нет.
                  has_more:
                    type: boolean

  /catalog/tariffs/{tariffId}:
    get:
      tags: [catalog-common]
      summary: Детали тарифа (любой категории)
      description: |
        Тип ответа определяется по полю `category`.
        Для home/landline/satellite_tv передай city_id для актуальной цены.
      parameters:
        - $ref: '#/components/parameters/TariffId'
        - name: city_id
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Карточка тарифа
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TariffHomeCard'
                  - $ref: '#/components/schemas/TariffMobileCard'
                  - $ref: '#/components/schemas/TariffDeviceCard'
                  - $ref: '#/components/schemas/TariffLandlineCard'
                  - $ref: '#/components/schemas/TariffSatelliteCard'
                  - $ref: '#/components/schemas/TariffBusinessCard'
                discriminator:
                  propertyName: category
                  mapping:
                    home: '#/components/schemas/TariffHomeCard'
                    mobile: '#/components/schemas/TariffMobileCard'
                    devices: '#/components/schemas/TariffDeviceCard'
                    landline: '#/components/schemas/TariffLandlineCard'
                    satellite_tv: '#/components/schemas/TariffSatelliteCard'
                    business: '#/components/schemas/TariffBusinessCard'
        '404':
          $ref: '#/components/responses/NotFound'

  /catalog/cities:
    get:
      tags: [catalog-common]
      summary: Справочник городов
      description: Для фильтров вкладок home, landline, satellite_tv.
      responses:
        '200':
          description: Список городов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/City'

  /catalog/services:
    get:
      tags: [catalog-common]
      summary: Список дополнительных услуг
      responses:
        '200':
          description: Список услуг
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'

  /applications:
    post:
      tags: [applications]
      summary: Подать заявку на подключение
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationCreate'
      responses:
        '201':
          description: Заявка создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '402':
          description: Недостаточно средств
        '422':
          description: Ошибка валидации

    get:
      tags: [applications]
      summary: Список заявок (Менеджер / Администратор)
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ApplicationStatus'
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Список заявок
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Application'
                  next_cursor:
                    type: string
                    nullable: true
                    description: Передай в параметр after для загрузки следующей порции. null — больше данных нет.
                  has_more:
                    type: boolean

  /applications/{applicationId}:
    get:
      tags: [applications]
      summary: Детали заявки
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Подробная информация о заявке
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /applications/{applicationId}/approve:
    post:
      tags: [applications]
      summary: Запросить одобрение заявки асинхронно (Менеджер)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '202':
          description: Команда на одобрение принята в асинхронную обработку
          content:
            application/json:
              schema:
                type: object
                required: [applicationId, correlationId, status]
                properties:
                  applicationId:
                    type: integer
                    format: int64
                  correlationId:
                    type: string
                  status:
                    type: string
                    example: ACCEPTED
        '409':
          description: Заявка уже обработана

  /applications/{applicationId}/reject:
    post:
      tags: [applications]
      summary: Отклонить заявку (Менеджер)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  example: "Технически невозможно подключение по данному адресу"
      responses:
        '200':
          description: Заявка отклонена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'

  /account/tariff:
    get:
      tags: [account]
      summary: Текущий тариф пользователя
      description: |
        Возвращает активный тариф.
        Если тариф ещё не подключён — возвращает 200 с `tariff: null`.
        Это не ошибка: пользователь мог ещё не оформить подключение.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Текущий тариф или null если тариф не подключён
          content:
            application/json:
              schema:
                type: object
                properties:
                  tariff:
                    nullable: true
                    description: null если тариф не подключён
                    oneOf:
                      - $ref: '#/components/schemas/TariffHomeCard'
                      - $ref: '#/components/schemas/TariffMobileCard'
                      - $ref: '#/components/schemas/TariffDeviceCard'
                      - $ref: '#/components/schemas/TariffLandlineCard'
                      - $ref: '#/components/schemas/TariffSatelliteCard'
                      - $ref: '#/components/schemas/TariffBusinessCard'
                    discriminator:
                      propertyName: category

    patch:
      tags: [account]
      summary: Настроить текущий тариф (доп. услуги)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TariffConfigure'
      responses:
        '200':
          description: Настройки обновлены
        '409':
          description: Тариф не подключён, нечего настраивать
        '422':
          description: Ошибка валидации

  /account/services:
    get:
      tags: [account]
      summary: Подключённые доп. услуги
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список подключённых услуг
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'

    post:
      tags: [account]
      summary: Подключить дополнительные услуги
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service_ids]
              properties:
                service_ids:
                  type: array
                  items:
                    type: string
                  example: ["svc_001", "svc_002"]
      responses:
        '200':
          description: Услуги подключены
        '402':
          description: Недостаточно средств

  /account/applications:
    get:
      tags: [account]
      summary: Мои заявки (для отслеживания статуса)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список заявок пользователя
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Application'

  /account/balance:
    get:
      tags: [balance]
      summary: Проверить баланс
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Текущий баланс
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'

  /account/balance/top-up:
    post:
      tags: [balance]
      summary: Инициировать пополнение баланса
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount:
                  type: number
                  minimum: 1
                  example: 500
                return_url:
                  type: string
                  description: URL для редиректа после оплаты
      responses:
        '200':
          description: Платёжная ссылка создана
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment_url:
                    type: string

  /admin/tariffs:
    post:
      tags: [tariffs]
      summary: Создать тарифный план
      description: Тело запроса зависит от категории. Дискриминатор — поле `category`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/TariffHomeCreate'
                - $ref: '#/components/schemas/TariffMobileCreate'
                - $ref: '#/components/schemas/TariffDeviceCreate'
                - $ref: '#/components/schemas/TariffLandlineCreate'
                - $ref: '#/components/schemas/TariffSatelliteCreate'
                - $ref: '#/components/schemas/TariffBusinessCreate'
              discriminator:
                propertyName: category
                mapping:
                  home: '#/components/schemas/TariffHomeCreate'
                  mobile: '#/components/schemas/TariffMobileCreate'
                  devices: '#/components/schemas/TariffDeviceCreate'
                  landline: '#/components/schemas/TariffLandlineCreate'
                  satellite_tv: '#/components/schemas/TariffSatelliteCreate'
                  business: '#/components/schemas/TariffBusinessCreate'
      responses:
        '201':
          description: Тариф создан
        '422':
          description: Ошибка валидации

  /admin/tariffs/{tariffId}:
    put:
      tags: [tariffs]
      summary: Редактировать тариф
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TariffId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/TariffHomeCreate'
                - $ref: '#/components/schemas/TariffMobileCreate'
                - $ref: '#/components/schemas/TariffDeviceCreate'
                - $ref: '#/components/schemas/TariffLandlineCreate'
                - $ref: '#/components/schemas/TariffSatelliteCreate'
                - $ref: '#/components/schemas/TariffBusinessCreate'
              discriminator:
                propertyName: category
                mapping:
                  home: '#/components/schemas/TariffHomeCreate'
                  mobile: '#/components/schemas/TariffMobileCreate'
                  devices: '#/components/schemas/TariffDeviceCreate'
                  landline: '#/components/schemas/TariffLandlineCreate'
                  satellite_tv: '#/components/schemas/TariffSatelliteCreate'
                  business: '#/components/schemas/TariffBusinessCreate'
      responses:
        '200':
          description: Тариф обновлён
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/tariffs/{tariffId}/archive:
    post:
      tags: [tariffs]
      summary: Архивировать тариф
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TariffId'
      responses:
        '200':
          description: Тариф переведён в архив
        '409':
          description: Тариф уже архивирован

  /admin/tariffs/{tariffId}/connect:
    post:
      tags: [tariffs]
      summary: Подключить тариф пользователю (после одобрения заявки)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TariffId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, application_id]
              properties:
                user_id:
                  type: string
                application_id:
                  type: string
      responses:
        '200':
          description: Тариф подключён
        '422':
          description: Ошибка подключения

   /admin/services:
     post:
       tags: [tariffs]
       summary: Создать дополнительную услугу
       description: Создаёт запись в справочнике дополнительных услуг.
       security:
         - bearerAuth: []
       requestBody:
         required: true
         content:
           application/json:
             schema:
               $ref: '#/components/schemas/ServiceCreate'
       responses:
         '201':
           description: Услуга создана
           content:
             application/json:
               schema:
                 type: object
                 properties:
                   id:
                     type: string
                     example: "123"
         '422':
           description: Ошибка валидации

   # — 1C INTEGRATION API ——————————————————————

   /api/one-c/sync/application/{applicationId}:
     get:
       tags: [one-c-integration]
       summary: Получить историю синхронизации заявки с 1С
       description: |
         Возвращает список попыток синхронизации конкретной заявки с 1C системой.
         Отслеживает: external_id, sync_status, retry_count, ошибки.
       parameters:
         - name: applicationId
           in: path
           required: true
           schema:
             type: integer
             format: int64
         - name: page
           in: query
           schema:
             type: integer
             default: 0
         - name: size
           in: query
           schema:
             type: integer
             default: 20
       responses:
         '200':
           description: Пагинированный список синхронизаций
           content:
             application/json:
               schema:
                 type: object
                 properties:
                   content:
                     type: array
                     items:
                       $ref: '#/components/schemas/OneCyncHistoryDTO'
                   totalElements:
                     type: integer
                   totalPages:
                     type: integer
         '404':
           description: Заявка не найдена

   /api/one-c/sync/external/{externalId}:
     get:
       tags: [one-c-integration]
       summary: Получить синхронизацию по external ID 1C
       description: Поиск синхронизации по уникальному идентификатору из 1C
       parameters:
         - name: externalId
           in: path
           required: true
           schema:
             type: string
       responses:
         '200':
           description: Найдена синхронизация
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/OneCyncHistoryDTO'
         '404':
           description: Синхронизация не найдена

   /api/one-c/errors/stats:
     get:
       tags: [one-c-integration]
       summary: Статистика ошибок интеграции
       description: Возвращает количество ошибок по типам (INSUFFICIENT_FUNDS, TIMEOUT, NETWORK_ERROR, etc.)
       responses:
         '200':
           description: Статистика ошибок
           content:
             application/json:
               schema:
                 type: array
                 items:
                   type: object
                   properties:
                     errorDetail:
                       type: string
                       enum: [INSUFFICIENT_FUNDS, TIMEOUT, VALIDATION_ERROR, NETWORK_ERROR, UNKNOWN_ERROR]
                     count:
                       type: integer

   /api/one-c/rejected:
     get:
       tags: [one-c-integration]
       summary: Список отклоненных заявок (требующих review)
       description: |
         Возвращает заявки, отклоненные 1C системой (например, due to insufficient funds).
         Требуют manual review от администратора.
       parameters:
         - name: page
           in: query
           schema:
             type: integer
             default: 0
         - name: size
           in: query
           schema:
             type: integer
             default: 20
       responses:
         '200':
           description: Пагинированный список отклонений
           content:
             application/json:
               schema:
                 type: object
                 properties:
                   content:
                     type: array
                     items:
                       $ref: '#/components/schemas/RejectedApplicationDTO'
                   totalElements:
                     type: integer

   /api/one-c/rejected/count:
     get:
       tags: [one-c-integration]
       summary: Количество заявок на review
       description: Быстрая проверка кол-ва очереди manual review
       responses:
         '200':
           description: Количество
           content:
             application/json:
               schema:
                 type: object
                 properties:
                   pendingReviewCount:
                     type: integer

   /api/one-c/rejected/application/{applicationId}:
     get:
       tags: [one-c-integration]
       summary: Получить все отклонения конкретной заявки
       parameters:
         - name: applicationId
           in: path
           required: true
           schema:
             type: integer
             format: int64
       responses:
         '200':
           description: Список отклонений
           content:
             application/json:
               schema:
                 type: array
                 items:
                   $ref: '#/components/schemas/RejectedApplicationDTO'

   /api/one-c/sync/{syncId}/retry:
     post:
       tags: [one-c-integration]
       summary: Ручной ретрай синхронизации
       description: |
         Администратор может принудительно переотправить заявку в 1C.
         API сбросит retry_count и попробует синхронизацию сразу.
       parameters:
         - name: syncId
           in: path
           required: true
           schema:
             type: integer
             format: int64
       responses:
         '200':
           description: Ретрай запланирован
           content:
             application/json:
               schema:
                 type: object
                 properties:
                   message:
                     type: string
                     example: "Retry scheduled"
         '404':
           description: Запись синхронизации не найдена

   /api/one-c/rejected/{rejectionId}/review:
     post:
       tags: [one-c-integration]
       summary: Отметить отклонение как reviewed
       description: |
         Администратор проверил отклоненную заявку, принял решение и отмечает факт review.
       parameters:
         - name: rejectionId
           in: path
           required: true
           schema:
             type: integer
             format: int64
       requestBody:
         required: true
         content:
           application/json:
             schema:
               $ref: '#/components/schemas/ReviewRejectionRequest'
       responses:
         '200':
           description: Отклонение отмечено как reviewed
           content:
             application/json:
               schema:
                 type: object
                 properties:
                   message:
                     type: string


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TariffId:
      name: tariffId
      in: path
      required: true
      schema:
        type: string
      example: "trf_abc123"

    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema:
        type: string
      example: "app_xyz789"

    After:
      name: after
      in: query
      description: Cursor — id последнего полученного тарифа. Передаётся из поля next_cursor предыдущего ответа. Не передавай при первом запросе.
      schema:
        type: string
      example: "trf_abc123"

    Limit:
      name: limit
      in: query
      description: Кол-во элементов на странице
      schema:
        type: integer
        default: 20
        maximum: 100

  responses:
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:

    # ── КАРТОЧКИ ТАРИФОВ (ответ) ──────────────────────────

    TariffBase:
      type: object
      description: Общие поля для всех карточек тарифов
      required: [id, name, category, price, status]
      properties:
        id:
          type: string
        name:
          type: string
          example: "Домашний Лайт"
        category:
          type: string
          enum: [home, mobile, devices, landline, satellite_tv, business]
        price:
          type: number
          example: 499.00
        status:
          type: string
          enum: [active, archived]
        description:
          type: string
          nullable: true

    TariffHomeCard:
      description: "Карточка «Связь, ТВ и интернет»"
      allOf:
        - $ref: '#/components/schemas/TariffBase'
        - type: object
          properties:
            category:
              type: string
              enum: [home]
            speed_mbps:
              type: integer
              example: 500
            tv_channels:
              type: integer
              example: 200
              nullable: true
            services:
              type: array
              items:
                $ref: '#/components/schemas/Service'

    TariffMobileCard:
      description: "Карточка «Мобильная связь»"
      allOf:
        - $ref: '#/components/schemas/TariffBase'
        - type: object
          properties:
            category:
              type: string
              enum: [mobile]
            internet_gb:
              type: integer
              example: 30
            calls_minutes:
              type: integer
              example: 500
            sms_count:
              type: integer
              example: 100
              nullable: true
            for_family:
              type: boolean
              example: false
            no_subscription_fee:
              type: boolean
              example: false

    TariffDeviceCard:
      description: "Карточка «Для часов и модемов»"
      allOf:
        - $ref: '#/components/schemas/TariffBase'
        - type: object
          properties:
            category:
              type: string
              enum: [devices]
            internet_gb:
              type: integer
              example: 10
            device_type:
              type: string
              enum: [watch, modem]

    TariffLandlineCard:
      description: "Карточка «Домашний телефон»"
      allOf:
        - $ref: '#/components/schemas/TariffBase'
        - type: object
          properties:
            category:
              type: string
              enum: [landline]
            local_minutes:
              type: integer
              nullable: true
              description: null = безлимит
            intercity_minutes:
              type: integer
              nullable: true
            mobile_minutes:
              type: integer
              nullable: true

    TariffSatelliteCard:
      description: "Карточка «Спутниковое ТВ»"
      allOf:
        - $ref: '#/components/schemas/TariffBase'
        - type: object
          properties:
            category:
              type: string
              enum: [satellite_tv]
            channels_total:
              type: integer
              example: 350
            channels_hd:
              type: integer
              example: 80
              nullable: true

    TariffBusinessCard:
      description: "Карточка «Для бизнеса»"
      allOf:
        - $ref: '#/components/schemas/TariffBase'
        - type: object
          properties:
            category:
              type: string
              enum: [business]
            speed_mbps:
              type: integer
              example: 1000
            sla_description:
              type: string
              nullable: true
              example: "Гарантированный аптайм 99.9%"
            services:
              type: array
              items:
                $ref: '#/components/schemas/Service'

    # ── СОЗДАНИЕ ТАРИФОВ (запрос) ─────────────────────────

    TariffCreateBase:
      type: object
      required: [name, category, price]
      properties:
        name:
          type: string
        category:
          type: string
          enum: [home, mobile, devices, landline, satellite_tv, business]
        price:
          type: number
          minimum: 0
        description:
          type: string
          nullable: true

    TariffCityPrices:
      type: object
      properties:
        city_prices:
          type: array
          description: Цены по городам. Если города нет в списке — тариф там недоступен.
          items:
            type: object
            required: [city_id, price]
            properties:
              city_id:
                type: string
              price:
                type: number

    TariffHomeCreate:
      allOf:
        - $ref: '#/components/schemas/TariffCreateBase'
        - $ref: '#/components/schemas/TariffCityPrices'
        - type: object
          required: [speed_mbps]
          properties:
            category:
              type: string
              enum: [home]
            speed_mbps:
              type: integer
              minimum: 1
            tv_channels:
              type: integer
              nullable: true
            service_ids:
              type: array
              items:
                type: string

    TariffMobileCreate:
      allOf:
        - $ref: '#/components/schemas/TariffCreateBase'
        - type: object
          required: [internet_gb, calls_minutes]
          properties:
            category:
              type: string
              enum: [mobile]
            internet_gb:
              type: integer
              minimum: 0
            calls_minutes:
              type: integer
              minimum: 0
            sms_count:
              type: integer
              nullable: true
            for_family:
              type: boolean
              default: false
            no_subscription_fee:
              type: boolean
              default: false

    TariffDeviceCreate:
      allOf:
        - $ref: '#/components/schemas/TariffCreateBase'
        - type: object
          required: [internet_gb, device_type]
          properties:
            category:
              type: string
              enum: [devices]
            internet_gb:
              type: integer
              minimum: 0
            device_type:
              type: string
              enum: [watch, modem]

    TariffLandlineCreate:
      allOf:
        - $ref: '#/components/schemas/TariffCreateBase'
        - $ref: '#/components/schemas/TariffCityPrices'
        - type: object
          properties:
            category:
              type: string
              enum: [landline]
            local_minutes:
              type: integer
              nullable: true
            intercity_minutes:
              type: integer
              nullable: true
            mobile_minutes:
              type: integer
              nullable: true

    TariffSatelliteCreate:
      allOf:
        - $ref: '#/components/schemas/TariffCreateBase'
        - $ref: '#/components/schemas/TariffCityPrices'
        - type: object
          required: [channels_total]
          properties:
            category:
              type: string
              enum: [satellite_tv]
            channels_total:
              type: integer
              minimum: 1
            channels_hd:
              type: integer
              nullable: true

    TariffBusinessCreate:
      allOf:
        - $ref: '#/components/schemas/TariffCreateBase'
        - type: object
          required: [speed_mbps]
          properties:
            category:
              type: string
              enum: [business]
            speed_mbps:
              type: integer
              minimum: 1
            sla_description:
              type: string
              nullable: true
            service_ids:
              type: array
              items:
                type: string

    TariffConfigure:
      type: object
      properties:
        service_ids:
          type: array
          items:
            type: string

    # ── СПРАВОЧНИКИ ───────────────────────────────────────

    City:
      type: object
      properties:
        id:
          type: string
          example: "city_msk"
        name:
          type: string
          example: "Москва"
        region:
          type: string
          example: "Московская область"

    Service:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          example: "Антивирус"
        price:
          type: number
          example: 99.00
        description:
          type: string

    ServiceCreate:
      type: object
      required: [name, price]
      properties:
        name:
          type: string
          example: "Антивирус"
        price:
          type: number
          minimum: 0
          example: 99.00
        description:
          type: string
          nullable: true

    # ── ЗАЯВКИ ────────────────────────────────────────────

    ApplicationCreate:
      type: object
      required: [tariff_id, address]
      properties:
        tariff_id:
          type: string
        address:
          type: string
          example: "г. Москва, ул. Примерная, д. 1, кв. 10"
        additional_service_ids:
          type: array
          items:
            type: string

    ApplicationStatus:
      type: string
      enum: [pending, approved, rejected, connected]

    Application:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        tariff_id:
          type: string
        tariff_name:
          type: string
        address:
          type: string
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        reject_reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ApplicationDetail:
      allOf:
        - $ref: '#/components/schemas/Application'
        - type: object
          properties:
            additional_services:
              type: array
              items:
                $ref: '#/components/schemas/Service'
            passport_verified:
              type: boolean
            technical_feasibility:
              type: boolean

    # ── БАЛАНС ────────────────────────────────────────────

    Balance:
      type: object
      properties:
        amount:
          type: number
          example: 1250.50
        currency:
          type: string
          example: "RUB"
        updated_at:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string

    UserCreateRequest:
      type: object
      required: [email, name, password]
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        name:
          type: string
          example: "Иван Иванов"
        password:
          type: string
          description: Пароль пользователя (минимум 6 символов)
          minLength: 6

    UserResponse:
       type: object
       required: [id, email, name, role, created_at]
       properties:
         id:
           type: string
           example: "123"
         email:
           type: string
           format: email
           example: "user@example.com"
         name:
           type: string
           example: "Иван Иванов"
         role:
           type: string
           example: "USER"
         created_at:
           type: string
           format: date-time

     # — 1C INTEGRATION SCHEMAS ———————————————

     OneCyncHistoryDTO:
       type: object
       description: История синхронизации заявки с 1C
       properties:
         id:
           type: integer
           format: int64
         applicationId:
           type: integer
           format: int64
         externalId:
           type: string
           description: Уникальный ID в 1C системе
           nullable: true
         syncStatus:
           type: string
           enum: [PENDING, SUCCESS, INSUFFICIENT_FUNDS, REJECTED, RETRY, DLQ]
           description: |
             - PENDING: ожидание обработки
             - SUCCESS: успешно синхронизирована
             - INSUFFICIENT_FUNDS: отклонена, недостаточно средств
             - REJECTED: отклонена 1C
             - RETRY: ошибка, будет повторена
             - DLQ: Dead Letter Queue, максимум ретраев превышен
         syncDirection:
           type: string
           enum: [TO_1C, FROM_1C]
         retryCount:
           type: integer
           description: Текущее число попыток
         maxRetries:
           type: integer
           description: Максимум попыток (default 5)
         lastError:
           type: string
           nullable: true
           description: Последнее сообщение об ошибке
         lastSyncAt:
           type: string
           format: date-time
           nullable: true
           description: Когда была последняя успешная синхронизация
         nextRetryAt:
           type: string
           format: date-time
           description: Когда будет следующего retry (exponential backoff 2^retryCount с)
         createdAt:
           type: string
           format: date-time
         updatedAt:
           type: string
           format: date-time

     RejectedApplicationDTO:
       type: object
       description: Отклоненная заявка, требующая manual review
       properties:
         id:
           type: integer
           format: int64
         applicationId:
           type: integer
           format: int64
         syncHistoryId:
           type: integer
           format: int64
           nullable: true
         rejectionReason:
           type: string
           example: "Insufficient funds in 1C system"
         errorCode:
           type: string
           example: "INSUFFICIENT_FUNDS"
         manualReviewRequired:
           type: boolean
           default: true
         reviewedAt:
           type: string
           format: date-time
           nullable: true
         reviewedBy:
           type: string
           nullable: true
         createdAt:
           type: string
           format: date-time

     ReviewRejectionRequest:
       type: object
       required: [reviewedBy]
       properties:
         reviewedBy:
           type: string
           example: "admin@local"
           description: Почта администратора, проводящего review
         notes:
           type: string
           nullable: true
           description: Заметки для истории
         approve:
           type: boolean
           default: false
           description: Одобрить ли для дальнейшей обработки


